name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - main
      - data
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# 无论由代码还是数据触发，始终只保留最新一次完整部署。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # data 分支触发时也必须构建 main，而不是把数据分支当作站点源码。
      - name: Checkout site source from main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check whether the data branch exists
        id: data_branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The data branch does not exist; using the snapshot bundled with main."
          fi

      - name: Checkout latest data snapshot
        if: steps.data_branch.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: data
          path: temp_data
          fetch-depth: 1

      - name: Overlay generated data
        if: steps.data_branch.outputs.exists == 'true'
        shell: bash
        run: |
          mkdir -p public/assets/data

          if compgen -G "temp_data/public/assets/data/*.json" > /dev/null; then
            rm -f public/assets/data/*.json
            cp temp_data/public/assets/data/*.json public/assets/data/
          fi

          rm -rf temp_data

      - name: Install, build and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
