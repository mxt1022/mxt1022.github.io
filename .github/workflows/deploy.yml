name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: temp_data
      
      - name: Copy data files
        run: |
          mkdir -p public/assets/data
          # 如果 data 分支存在对应目录，则复制；否则忽略（首次可能为空）
          if [ -d temp_data/public/assets/data ]; then
            cp temp_data/public/assets/data/*.json public/assets/data/
          fi
          rm -rf temp_data

      - name: Install, build and upload Astro site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
