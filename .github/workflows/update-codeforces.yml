name: Update Codeforces data

on:
  schedule:
    # GitHub Actions 使用 UTC；北京时间每天 08:23 更新。
    - cron: '23 0 * * *'
  workflow_dispatch:

# 定时任务与手动任务串行执行，避免同时向 data 分支推送。
concurrency:
  group: codeforces-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # 脚本始终取自 main，自动任务不会在 main 中生成或提交数据。
      - name: Checkout site source
        uses: actions/checkout@v7
        with:
          ref: main
          path: source
          persist-credentials: false

      # data 是独立的数据分支；这里只更新其中的 JSON 文件。
      - name: Checkout data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: source/requirements-codeforces.txt

      - name: Install fetch dependency
        run: python -m pip install -r source/requirements-codeforces.txt

      - name: Fetch Codeforces data
        env:
          CODEFORCES_HANDLE: InsaneArrogant
          CODEFORCES_OUTPUT_DIR: ${{ github.workspace }}/data/public/assets/data
        run: python source/fetch_contests.py

      - name: Commit data branch when changed
        working-directory: data
        shell: bash
        run: |
          rm -f public/assets/data/placeholder.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/assets/data

          if git diff --cached --quiet; then
            echo "Codeforces data is already current."
            exit 0
          fi

          git commit -m "data: update Codeforces snapshot"
          git push origin HEAD:data

  # GITHUB_TOKEN 推送不会再次触发 push 工作流，因此显式调用部署。
  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
